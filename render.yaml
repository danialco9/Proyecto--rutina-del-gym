# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The database lives on Neon; set GYM_DATABASE_URL in the dashboard when creating the service.
services:
  - type: web
    name: gym-tracker-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: GYM_DATABASE_URL
        sync: false
      - key: GYM_JWT_SECRET
        generateValue: true
      - key: GYM_COOKIE_SECURE
        value: "true"
      - key: GYM_DEMO_ENABLED
        value: "true"
      - key: GYM_TIMEZONE
        value: Europe/Madrid
      # Password reset emails: links point at the web app, and go out through Brevo.
      - key: GYM_APP_URL
        value: https://gym-tracker-two-beta.vercel.app
      - key: GYM_BREVO_API_KEY
        sync: false
      - key: GYM_MAIL_FROM
        sync: false
